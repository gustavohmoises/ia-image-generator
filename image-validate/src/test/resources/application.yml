spring:
  application:
    name: image-validate

  kafka:
    bootstrap-servers: localhost:9092

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:image-validate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none

api:
  security:
    token:
      secret: test-secret

server:
  port: 0