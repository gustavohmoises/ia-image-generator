spring:
  application:
    name: image-request

  kafka:
    bootstrap-servers: localhost:9092

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:image-request;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

server:
  port: 0